<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — CodeAlpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --room: #141312;
    --room-edge: #1c1a18;
    --mat: #efeae1;
    --mat-shadow: rgba(0,0,0,0.5);
    --ink: #1d1a16;
    --ink-soft: #a39c8f;
    --amber: #c9862e;
    --rust: #9c5a3c;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--room);
    background-image: radial-gradient(circle at 50% 0%, var(--room-edge), var(--room) 60%);
    color: var(--mat);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }

  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 24px 28px;
  }

  .kicker {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(32px, 5vw, 48px);
    margin: 0 0 24px;
    color: var(--mat);
    letter-spacing: -0.01em;
  }

  .filters {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid #2a2724;
    flex-wrap: wrap;
  }

  .filter {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    padding: 10px 16px 12px;
    cursor: pointer;
    position: relative;
    transition: color 0.15s ease;
  }
  .filter::after {
    content: "";
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: -1px;
    height: 2px;
    background: var(--amber);
    transform: scaleX(0);
    transition: transform 0.2s ease;
  }
  .filter:hover { color: var(--mat); }
  .filter.active { color: var(--mat); }
  .filter.active::after { transform: scaleX(1); }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
  }

  .frame {
    background: var(--mat);
    padding: 12px 12px 44px;
    box-shadow: 0 18px 34px -14px var(--mat-shadow);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    opacity: 0;
    transform: translateY(10px);
    animation: settle 0.5s ease forwards;
  }
  .frame:nth-child(1) { animation-delay: 0.02s; }
  .frame:nth-child(2) { animation-delay: 0.06s; }
  .frame:nth-child(3) { animation-delay: 0.10s; }
  .frame:nth-child(4) { animation-delay: 0.14s; }
  .frame:nth-child(5) { animation-delay: 0.18s; }
  .frame:nth-child(6) { animation-delay: 0.22s; }
  .frame:nth-child(7) { animation-delay: 0.26s; }
  .frame:nth-child(8) { animation-delay: 0.30s; }

  @keyframes settle {
    to { opacity: 1; transform: translateY(0); }
  }

  .frame:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 40px -12px rgba(156,90,60,0.45);
  }

  .frame .pic {
    position: relative;
    overflow: hidden;
    background: #0e0d0c;
    aspect-ratio: 4 / 3;
  }
  .frame .pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(15%) contrast(1.02);
    transition: transform 0.4s ease, filter 0.4s ease;
  }
  .frame:hover .pic img {
    transform: scale(1.06);
    filter: grayscale(0%) contrast(1.05);
  }

  .caption {
    font-family: 'Fraunces', serif;
    color: var(--ink);
    font-size: 15px;
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .caption .num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    color: #8a8377;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,9,8,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 24px;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }

  .lightbox-frame {
    background: var(--mat);
    padding: 20px 20px 26px;
    max-width: min(760px, 92vw);
    width: 100%;
    transform: scale(0.94);
    transition: transform 0.25s ease;
    position: relative;
  }
  .lightbox.open .lightbox-frame { transform: scale(1); }

  .lightbox-pic {
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #0e0d0c;
  }
  .lightbox-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .lightbox-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 14px;
    color: var(--ink);
  }
  .lightbox-meta h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin: 0;
  }
  .lightbox-meta span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    color: #8a8377;
  }

  .lb-close {
    position: absolute;
    top: -18px;
    right: -18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--room);
    color: var(--mat);
    border: 1px solid #333;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lb-close:hover { background: var(--rust); border-color: var(--rust); }

  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(20,19,18,0.7);
    color: var(--mat);
    border: 1px solid rgba(255,255,255,0.15);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }
  .lb-nav:hover { background: var(--rust); }
  .lb-prev { left: -22px; }
  .lb-next { right: -22px; }

  @media (max-width: 640px) {
    .lb-prev { left: 4px; }
    .lb-next { right: 4px; }
    .lb-close { top: 4px; right: 4px; }
  }

  button:focus-visible, .filter:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .frame, .frame .pic img, .lightbox, .lightbox-frame { transition: none; animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<header>
  <p class="kicker">a small collection</p>
  <h1>Field Notes</h1>
  <div class="filters" id="filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="nature">Nature</button>
    <button class="filter" data-filter="urban">Urban</button>
    <button class="filter" data-filter="travel">Travel</button>
  </div>
</header>

<main class="grid" id="grid"></main>

<div class="lightbox" id="lightbox">
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">‹</button>
  <div class="lightbox-frame">
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <div class="lightbox-pic">
      <img id="lbImg" src="" alt="">
    </div>
    <div class="lightbox-meta">
      <h2 id="lbTitle"></h2>
      <span id="lbCount"></span>
    </div>
  </div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">›</button>
</div>

<script>
(function () {
  const photos = [
    { id: 1, title: "Ridge Line",     cat: "nature", src: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80" },
    { id: 2, title: "Glass & Steel",  cat: "urban",  src: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800&q=80" },
    { id: 3, title: "Coastal Road",   cat: "travel", src: "https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=800&q=80" },
    { id: 4, title: "Fern Light",     cat: "nature", src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" },
    { id: 5, title: "Night Transit",  cat: "urban",  src: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=800&q=80" },
    { id: 6, title: "Terraced Hills", cat: "travel", src: "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800&q=80" },
    { id: 7, title: "Old Quarter",    cat: "urban",  src: "https://images.unsplash.com/photo-1519677100203-a0e668c92439?w=800&q=80" },
    { id: 8, title: "River Bend",     cat: "nature", src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" }
  ];

  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  let activeFilter = 'all';
  let visible = photos.slice();
  let lightboxIndex = 0;

  function render() {
    visible = activeFilter === 'all' ? photos : photos.filter(p => p.cat === activeFilter);
    grid.innerHTML = visible.map((p, i) => `
      <figure class="frame" data-index="${i}" tabindex="0" role="button" aria-label="Open ${p.title}">
        <div class="pic"><img src="${p.src}" alt="${p.title}" loading="lazy"></div>
        <figcaption class="caption">
          <span>${p.title}</span>
          <span class="num">${String(i + 1).padStart(2, '0')} / ${String(visible.length).padStart(2, '0')}</span>
        </figcaption>
      </figure>
    `).join('');

    grid.querySelectorAll('.frame').forEach(frame => {
      frame.addEventListener('click', () => openLightbox(parseInt(frame.dataset.index)));
      frame.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(parseInt(frame.dataset.index)); }
      });
    });
  }

  filters.querySelectorAll('.filter').forEach(btn => {
    btn.addEventListener('click', () => {
      filters.querySelector('.active').classList.remove('active');
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbTitle = document.getElementById('lbTitle');
  const lbCount = document.getElementById('lbCount');

  function openLightbox(index) {
    lightboxIndex = index;
    updateLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  function updateLightbox() {
    const p = visible[lightboxIndex];
    lbImg.src = p.src;
    lbImg.alt = p.title;
    lbTitle.textContent = p.title;
    lbCount.textContent = `${lightboxIndex + 1} / ${visible.length}`;
  }
  function nextImage() { lightboxIndex = (lightboxIndex + 1) % visible.length; updateLightbox(); }
  function prevImage() { lightboxIndex = (lightboxIndex - 1 + visible.length) % visible.length; updateLightbox(); }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbNext').addEventListener('click', nextImage);
  document.getElementById('lbPrev').addEventListener('click', prevImage);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  window.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'ArrowLeft') prevImage();
  });

  render();
})();
</script>

</body>
</html>
